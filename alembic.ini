# Configuration Alembic InduSense.
#
# Aucun identifiant ici : l'URL de la base est lue dans .env par indusense.settings (voir migrations/env.py).
# Le schéma bronze est décrit par les contrats config/bronze/*.json ; toute modification de contrat qui change
# le DDL passe par une migration générée, relue, puis appliquée (voir bronze.ipynb).

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
