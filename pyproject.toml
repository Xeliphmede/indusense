[project]
name = "indusense"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tanai Hopuetai", email = "tanai.hopuetai@infologis.fr" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "jsonschema>=4.26.0",
    "pandas>=3.1.1",
    "pandera>=0.36.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "sqlglot>=30.33.0",
]

[project.scripts]
indusense = "indusense.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = ["integration: nécessite PostgreSQL (docker compose up -d db)"]
